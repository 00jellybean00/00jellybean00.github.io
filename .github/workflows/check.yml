# 이 저장소에는 자동 검사가 없어서, 사람이 안 돌리면 그대로 배포되던 문제가 있었다.
# 여기서 세 가지를 막는다.
#   1) 별 애니메이션의 수치 약속과 루프 수명이 깨지는 것
#   2) 내 컴퓨터에서는 되고 웹에 올리면 404가 나는 경로
#   3) 파일도 문법도 멀쩡한데 화면에 그려진 모습만 틀린 것
# 3번은 2026-07-27 에 결함 네 건이 1·2번 검사를 전부 통과하고 넘어간 뒤 추가했다.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 액션 버전은 Node 24 런타임을 쓰는 것으로 맞춘다.
      # v4 는 Node 20 을 쓴다고 선언해서, 러너가 24 로 강제 실행하며 매 실행마다 경고를 남겼다.
      # 두 액션 모두 v5 부터 node24 이고 v7 이 현재 최신이다.
      # 올리면서 확인한 것: checkout v7 이 막는 것은 fork PR 의 pull_request_target·workflow_run 인데
      # 이 워크플로는 push 와 pull_request 만 쓴다. setup-node v5 의 자동 캐시는
      # package.json 의 packageManager 항목을 보는데 이 저장소에는 package.json 이 없다.
      # 서브모듈은 검사에 필요 없다. 기본값(미체크아웃) 그대로 둔다.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 문법 검사
        run: |
          node --check assets/starfield.js
          node --check assets/starfield.selftest.js
          node --check assets/flow.js
          node --check assets/flow.selftest.js
          node --check .github/check-links.js
          node --check .github/check-render.js

      - name: 별 애니메이션 자체 검사
        run: node assets/starfield.selftest.js

      - name: 도식 조작 자체 검사
        run: node assets/flow.selftest.js

      - name: 링크·배포 검사
        run: node .github/check-links.js

      # 이 저장소는 의존성이 없는 것이 규칙이라 package.json 을 두지 않는다.
      # 검사할 때만 내려받고 --no-save 로 어디에도 기록하지 않는다.
      - name: 브라우저 설치
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: 화면 렌더링 검사
        run: node .github/check-render.js
